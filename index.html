<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>my title</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="country-card">
            <div class="contry-info">
                <h1 id="country">Australia</h1>
                <p id="capital">Capital: <span id="cap-value">Perth</span></p>
                <p id="pop">Population: <span id="pop-value">2,896,344</p>
                <p id="reg">Region: <span id="reg-value"></span></p>
                <p id="money">Currency: <span id="money-value"></span></p>
                <p id="lang">Language: <span id="lang-value">Australian English</span></p>
            </div>
            <div class="country-flag">
                <img id="flag-img" alt="Country flag" />
            </div>
        </div>
        <div class="input-btn">
            <input id="country-code" type="text" placeholder="Enter a country">
            <button id="country-btn">Update country</button>
        </div>
    </body>
    <script src="country.js"></script>
    <footer></footer>
</html>
